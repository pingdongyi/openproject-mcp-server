services:
  openproject-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openproject-mcp-server
    restart: unless-stopped
    ports:
      - "${MCP_HTTP_PORT:-8000}:8000"
    environment:
      - OPENPROJECT_URL=${OPENPROJECT_URL}
      - OPENPROJECT_API_KEY=${OPENPROJECT_API_KEY}
      - OPENPROJECT_PROXY=${OPENPROJECT_PROXY:-}
      - MCP_API_KEYS=${MCP_API_KEYS:-}
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_HTTP_PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TEST_CONNECTION_ON_STARTUP=${TEST_CONNECTION_ON_STARTUP:-true}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.socket(); s.settimeout(3); s.connect(('localhost', 8000)); s.close()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
